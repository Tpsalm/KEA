<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KEA Contact Us</title><style>:root{color-scheme:dark;--bg:#081124;--panel:#131b2e;--line:#2d3b58;--ink:#e9f0ff;--muted:#9aa8c5;--lime:#a6e358}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0,#193d4e,transparent 34%),var(--bg);color:var(--ink);font:15px "Segoe UI",sans-serif}main{width:min(620px,calc(100% - 32px));margin:0 auto;padding:52px 0}h1{font-size:38px;margin:0}.eyebrow{color:var(--lime);font:700 11px monospace;letter-spacing:.14em;text-transform:uppercase}.panel{padding:22px;margin-top:22px;border:1px solid var(--line);background:var(--panel);border-radius:14px}label{display:block;margin:14px 0 6px;color:var(--muted);font-size:12px;text-transform:uppercase}input,textarea,button{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#081124;color:var(--ink);font:inherit}textarea{min-height:140px;resize:vertical}button{margin-top:16px;background:var(--lime);color:#203700;border:0;font-weight:700;cursor:pointer}a{color:var(--lime)}nav{display:flex;gap:14px;margin-top:20px;flex-wrap:wrap;font-size:13px}</style></head><body><main><p class="eyebrow">KEA / Support Desk</p><h1>Contact Us</h1><p style="color:var(--muted)">Send a private support request to the Super Admin team.</p><section class="panel"><form id="contact-form"><label>Subject<input name="subject" required placeholder="What do you need help with?"></label><label>Message<textarea name="message" required placeholder="Describe the issue..."></textarea></label><button type="submit">Send Support Request</button><p id="status" style="color:var(--lime)"></p></form></section><nav><a href="/">Directory</a><a href="/account.html">Profile & Settings</a><a href="/privacy.html">Privacy Policy</a></nav></main><script>document.getElementById('contact-form').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));const r=await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});document.getElementById('status').textContent=r.ok?'Support request sent to Super Admin.':'Please sign in before sending a request.';if(r.ok)e.currentTarget.reset()};</script></body></html>
