<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KEA Account & Settings</title><style>:root{color-scheme:dark;--bg:#081124;--panel:#131b2e;--line:#2d3b58;--ink:#e9f0ff;--muted:#9aa8c5;--lime:#a6e358;--orange:#ffb693}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0,#193d4e,transparent 34%),var(--bg);color:var(--ink);font:15px "Segoe UI",sans-serif}main{width:min(680px,calc(100% - 32px));margin:0 auto;padding:36px 0 64px}a{color:var(--lime)}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}h1{margin:0;font:700 34px/1 "Segoe UI",sans-serif}.eyebrow{color:var(--lime);font:700 11px monospace;letter-spacing:.14em;text-transform:uppercase}.panel{padding:20px;margin-top:14px;border:1px solid var(--line);background:var(--panel);border-radius:14px}label{display:block;margin:12px 0 6px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}input,button{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#081124;color:var(--ink);font:inherit}button{margin-top:16px;background:var(--lime);color:#203700;border:0;font-weight:700;cursor:pointer}.avatar{width:88px;height:88px;border-radius:20px;object-fit:cover;background:#222a3d;border:1px solid var(--line)}.links{display:flex;gap:14px;flex-wrap:wrap;margin-top:22px;font-size:13px}@media(max-width:500px){header{display:block}.avatar{margin-top:18px}}
</style></head><body><main><header><div><p class="eyebrow">KEA / Account Center</p><h1>Profile & settings</h1><p id="identity" style="color:var(--muted)">Loading account...</p></div><img class="avatar" id="avatar" alt="Your profile image"></header><section class="panel"><h2>Profile</h2><form id="profile-form"><label for="displayName">Display name</label><input id="displayName" name="displayName" required><label for="phone">Phone</label><input id="phone" name="phone" type="tel" placeholder="+234..."><label for="avatarInput">Profile image</label><input id="avatarInput" type="file" accept="image/*"><button type="submit">Save profile</button><p id="profile-status" style="color:var(--lime)"></p></form></section><section class="panel"><h2>Settings</h2><label><input id="notifications" type="checkbox" checked style="width:auto;margin-right:8px"> Enable browser notifications</label><button id="sign-out" type="button" style="background:var(--orange);color:#4b1b00">Sign out</button></section><nav class="links"><a href="/">Web directory</a><a href="/contact.html">Contact Us</a><a href="/privacy.html">Privacy Policy</a></nav></main><script>
const avatar=document.getElementById('avatar');let user;
async function load(){const r=await fetch('/api/profile');if(!r.ok)return location.href='/kea_portal_mobile_shift_clock_in_gateway/code.html?returnTo=/account.html';const data=await r.json();user=data.user;const profile=data.profile||{};document.getElementById('identity').textContent=`${user.name} · ${user.role} · ${user.login}`;document.getElementById('displayName').value=profile.displayName||user.name;document.getElementById('phone').value=profile.phone||'';if(profile.hasAvatar)avatar.src=`/api/profile/avatar/${encodeURIComponent(user.login)}`;}
document.getElementById('profile-form').onsubmit=async event=>{event.preventDefault();const file=document.getElementById('avatarInput').files[0];const body={displayName:document.getElementById('displayName').value,phone:document.getElementById('phone').value};if(file)body.avatar={dataUrl:await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(file);})};const r=await fetch('/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});document.getElementById('profile-status').textContent=r.ok?'Profile saved.':'Unable to save profile.';if(r.ok)load();};document.getElementById('sign-out').onclick=async()=>{await fetch('/api/auth/sign-out',{method:'POST'});location.href='/'};load();
</script></body></html>
