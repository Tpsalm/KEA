databases:
  - name: kea-operations-db
    databaseName: kea_operations
    user: kea_operations
    plan: free

services:
  - type: web
    name: kea-operations-console
    runtime: node
    plan: free
    rootDir: stitch_multi_role_field_operations_tracker
    buildCommand: "npm install && node scripts/migrate.js"
    startCommand: "node server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kea-operations-db
          property: connectionString
